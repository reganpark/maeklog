<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1252" viewBox="0 0 600 1252" role="img" aria-labelledby="title desc">
<title id="title">From a long Codex conversation to a clear record</title>
<desc id="desc">Concept illustration using fictional search-filter work. Maeklog helps organize a decision to preserve selected filters, a report that filter retention was implemented and 12 tests passed, progress checking a narrow-screen layout, and a next action to write the PR summary after the visual check. The example work is reported, not independently verified. This is not a product screenshot.</desc>
<rect width="600" height="1252" fill="#fcfaf5"/>
<g font-family="Noto Sans, DejaVu Sans, sans-serif">
