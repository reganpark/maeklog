M 292 1084 L 300 1094 L 308 1084" fill="none" stroke="#282828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text font-size="34" font-weight="700" fill="#282828"><tspan x="40" y="1156">Pick up your work</tspan></text><text font-size="28" font-weight="400" fill="#282828"><tspan x="40" y="1202">Start from the next action.</tspan></text></g>
